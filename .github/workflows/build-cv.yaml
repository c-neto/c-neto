name: Build CV

on:
  push:
    branches:
      - main
    paths:
      - altacv.cls
      - c-neto-cv.tex
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build PDF with pdfTeX
        working-directory: ${{ github.workspace }}
        run: pdflatex -file-line-error -interaction=nonstopmode -halt-on-error c-neto-cv.tex

      - name: Commit updated PDF
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add c-neto-cv.pdf
          if git diff --cached --quiet; then
            echo "Generated PDF is unchanged."
          else
            git commit -m "Update generated CV PDF"
            git push
          fi
