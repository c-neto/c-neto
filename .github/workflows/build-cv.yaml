name: Build CV

env:
  CV_TEX_FILE: c-neto-cv.tex
  CV_PDF_FILE: carlos-neto-cv.pdf

on:
  push:
    branches:
      - main
    paths:
      - altacv.cls
      - c-neto-cv.tex
  workflow_dispatch: {}

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build PDF with pdfTeX
        working-directory: ${{ github.workspace }}
        run: pdflatex -file-line-error -interaction=nonstopmode -halt-on-error "-jobname=${CV_PDF_FILE%.pdf}" "$CV_TEX_FILE"

      - name: Upload generated PDF
        uses: actions/upload-artifact@v4
        with:
          name: generated-cv
          path: ${{ env.CV_PDF_FILE }}
          if-no-files-found: error

  commit:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated PDF
        uses: actions/download-artifact@v4
        with:
          name: generated-cv
          path: .

      - name: Commit updated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CV_PDF_FILE"
          if git diff --cached --quiet; then
            echo "Generated PDF is unchanged."
          else
            git commit -m "Update generated CV PDF"
            git push
          fi
